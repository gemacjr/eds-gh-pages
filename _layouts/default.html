<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist:wght@400..700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="min-h-dvh bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <div aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-[420px] bg-[radial-gradient(60%_100%_at_20%_0%,color-mix(in_oklch,var(--color-cat-system-design)_10%,transparent),transparent)]"></div>

  <header class="mx-auto flex max-w-6xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
    <a href="{{ '/' | relative_url }}" class="group flex items-center gap-2.5 font-semibold tracking-tight">
      <span aria-hidden="true" class="grid grid-cols-2 gap-0.5">
        <span class="size-2 rounded-[2px] bg-(--color-cat-system-design)"></span>
        <span class="size-2 rounded-[2px] bg-(--color-cat-spring)"></span>
        <span class="size-2 rounded-[2px] bg-(--color-cat-web)"></span>
        <span class="size-2 rounded-[2px] bg-(--color-cat-interview)"></span>
      </span>
      {{ site.title }}
    </a>
    <a href="https://github.com/gemacjr/eds-gh-pages" class="rounded-full px-3 py-1.5 text-sm text-zinc-600 ring-1 ring-zinc-950/10 transition hover:bg-white hover:text-zinc-900 dark:text-zinc-400 dark:ring-white/10 dark:hover:bg-white/5 dark:hover:text-white">Source on GitHub</a>
  </header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    {{ content }}
  </main>

  <footer class="mx-auto mt-24 max-w-6xl border-t border-zinc-950/5 px-4 py-10 text-sm text-zinc-500 sm:px-6 lg:px-8 dark:border-white/10">
    {{ site.specs | size }} specs. Built with Jekyll and Tailwind on GitHub Pages.
  </footer>
</body>
</html>
