<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="tagline">{{ site.description }}</span>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    {{ site.specs | size }} specs · built with Jekyll on GitHub Pages
  </footer>
</body>
</html>
